<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кав'ярня</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./catalog.css" />
  </head>

  <body>
    <header class="hero">
      <h1>☕ Кав'ярня</h1>
      <p>Смачна кава та солодощі щодня</p>
      <button onclick="scrollToMenu()">Переглянути меню</button>
    </header>

    <main>
      <section id="menu" class="menu-section coffee-section">
        <h2>☕ Кава</h2>

        <div class="products" id="coffeeProducts"></div>
      </section>

      <section class="menu-section sweets-section">
        <h2>🍰 Солодощі</h2>

        <div class="products" id="sweetsProducts"></div>
      </section>

      <section class="cart-section">
        <div class="cart-header">
          <h2>🛒 Кошик</h2>
          <span id="cartCount">0 товарів</span>
        </div>

        <div id="cartItems"></div>

        <div class="cart-bottom">
          <h3>Разом: <span id="total">0</span> грн</h3>
          <button class="order-btn" onclick="makeOrder()">Замовити</button>
        </div>
      </section>
    </main>

    <footer>
      <p>☕ Кав'ярня</p>
      <p>📞 +380 00 000 00 00</p>
      <p>📍 Україна</p>
    </footer>

    <script src="./catalog.js"></script>
  </body>
</html>>
